
# DNS 重定向端口
redir_port=5591
# 是否开启DNS劫持
enable_iptables="true"
# 是否阻断ipv6
block_ipv6_dns="false"
# 绕过源地址列表，用空格分隔
ignore_src_list=""
# 绕过目的地址列表，用空格分隔
ignore_dest_list=""



# 是否关闭usb调试
enable_usb="true"

# 开启AppOpt服务
enable_AppOpt="true"
# 是否屏蔽官方调度oiface
enable_oiface="true"

# 开启adguardhome服务
enable_adguardhome="true"

# 开启oxidns服务
enable_oxidns="true"

# 开启smartdns服务
enable_smartdns="true"

# 开启代理服务
enable_mihomo="true"
# 运行模式：
# blacklist(指定应用不走代理)
# whitelist(仅指定应用走代理)
# global(全局代理)
mode="blacklist"
# 开启socks
enable_socks="false"


# -------- 权重 --------
W_ADGUARD="10240"
W_MIHOMO="10240"
W_OXIDNS="10240"
W_SMARTDNS="10240"
W_APPOPT="10240"
#预留
RESERVE=25