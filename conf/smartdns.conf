# ==========================================
# 1. 端口绑定与分组（国内/国外）
# ==========================================

# home 组：国内 DNS
# -no-rule-nameserver：跳过 nameserver 域名规则，只用 -group 指定的上游
# 不加 -no-dualstack-selection：双栈优选由 SmartDNS 负责
bind 127.0.0.1:5445 -group home -no-rule-nameserver
bind-tcp 127.0.0.1:5445 -group home -no-rule-nameserver

# office 组：国外 DNS
# -no-speed-check：走代理的域名本地测速无参考价值，直接返回代理侧结果
bind 127.0.0.1:5555 -group office -no-rule-nameserver -no-speed-check
bind-tcp 127.0.0.1:5555 -group office -no-rule-nameserver -no-speed-check

tcp-idle-time 120
max-query-limit 512

server-name SmartDNS
log-file /data/adb/modules/Linlin/log/smartdns.log
log-level info
log-size 512k
log-num 1

audit-enable no
audit-num 16
audit-size 16M
audit-file /data/adb/modules/Linlin/log/smartdns-audit.log


# ==========================================
# 2. Bootstrap 与代理
# ==========================================
server 223.5.5.5 -bootstrap-dns -exclude-default-group
server 223.6.6.6 -bootstrap-dns -exclude-default-group

proxy-server socks5://Linlin:201314@127.0.0.1:7890 -name socks5


# ==========================================
# 3. 上游 DNS 与分组
# ==========================================

# ---------- 国内 home 组 ----------
# 国内加密 DNS，直连；阿里 DoT、腾讯 DoT、360 DoH，均为不同厂商
server-tls dns.alidns.com -e -g home
server-tls dot.pub -e -g home
server-https https://doh.360.cn/dns-query -e -g home


# ---------- 国外 office 组 ----------
# 国外加密 DNS，走代理
server-tls dns.quad9.net -e -g office -proxy socks5
server-tls one.one.one.one -e -g office -proxy socks5
server-tls dns.google -e -g office -proxy socks5
server-https https://cloudflare-dns.com/dns-query -e -g office -proxy socks5
server-https https://dns.google/dns-query -e -g office -proxy socks5
server-https https://doh.opendns.com/dns-query -e -g office -proxy socks5
server-https https://dns.adguard-dns.com/dns-query -e -g office -proxy socks5


# ==========================================
# 4. 双栈优选与响应策略
# ==========================================
# 双栈优选由 SmartDNS 独立决策（OxiDNS 只做分流转发）
dualstack-ip-selection yes
dualstack-ip-selection-threshold 200
force-AAAA-SOA no
dualstack-ip-allow-force-AAAA yes

rr-ttl-min 5
rr-ttl-max 86400
rr-ttl-reply-max 60
serve-expired-reply-ttl 5

response-mode fastest-ip
speed-check-mode ping,tcp:80,tcp:443


# ==========================================
# 5. 缓存
# ==========================================
cache-size 10000
cache-persist yes
cache-checkpoint-time 7200
cache-file /data/adb/modules/Linlin/cache/smartdns.cache

prefetch-domain yes
serve-expired yes
serve-expired-prefetch-time 3600
serve-expired-ttl 86400


# ==========================================
# 6. 证书、数据与 WebUI
# ==========================================
ca-file /data/adb/modules/Linlin/smartdnsData/Linlin.crt
data-dir /data/adb/modules/Linlin/smartdnsData/data

plugin /data/adb/modules/Linlin/smartdnsData/smartdns_ui.so
smartdns-ui.www-root /data/adb/modules/Linlin/smartdnsData/wwwroot
smartdns-ui.ip http://127.0.0.1:6080
smartdns-ui.token-expire 600
smartdns-ui.max-query-log-age 86400
smartdns-ui.enable-terminal no
smartdns-ui.enable-cors yes
smartdns-ui.user root
smartdns-ui.password root
