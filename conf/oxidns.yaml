
log:
  level: info
  file: "../log/oxidns.log"

api:
  http:
    listen: :9199
    webui:
      root: ./webui

plugins:

  # ==========================================
  # 1. 规则集
  # ==========================================

  - tag: cn_domains
    type: domain_set
    args:
      files:
        - "./custom_cn_domain.txt"
        - "./rules/cn_domain.txt"

  - tag: cdn_domains
    type: domain_set
    args:
      files:
        - "./rules/cdn_domain.txt"

  - tag: nocn_domains
    type: domain_set
    args:
      files:
        - "./custom_nocn_domain.txt"
        - "./rules/nocn_domain.txt"


  # ==========================================
  # 2. 上游 DNS
  # ==========================================

  # 国内 SmartDNS
  - tag: forward_local
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "tcp://127.0.0.1:5445"
          idle_timeout: 120
          timeout: 3s

  # 国外 SmartDNS
  - tag: forward_remote
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "tcp://127.0.0.1:5555"
          idle_timeout: 120
          timeout: 3s


  # ==========================================
  # 3. ECS 处理
  # ==========================================

  # 国内：保留客户端 ECS，不主动添加
  - tag: ecs_keep
    type: ecs_handler
    args:
      forward: true
      send: false

  # 国外：剥离客户端 ECS
  - tag: ecs_strip
    type: ecs_handler
    args:
      forward: false
      send: false


  # ==========================================
  # 4. 主线路查询链
  #    无有效答案时清除响应，交给备用线路
  # ==========================================

  # 国内主线路
  - tag: seq_local
    type: sequence
    args:
      - exec: "$ecs_keep"
      - exec: "$forward_local"

      # SERVFAIL / REFUSED
      - matches: "rcode SERVFAIL,REFUSED"
        exec: drop_resp

      # NXDOMAIN：交给备用线路重新查询
      - matches: "rcode NXDOMAIN"
        exec: drop_resp

      # NOERROR 但没有当前查询类型的有效答案
      # 包括 NODATA 和不完整 CNAME
      - matches:
          - "rcode NOERROR"
          - "!has_wanted_ans"
        exec: drop_resp


  # 国外主线路
  - tag: seq_remote
    type: sequence
    args:
      - exec: "$ecs_strip"
      - exec: "$forward_remote"

      # SERVFAIL / REFUSED
      - matches: "rcode SERVFAIL,REFUSED"
        exec: drop_resp

      # NXDOMAIN：交给备用线路重新查询
      - matches: "rcode NXDOMAIN"
        exec: drop_resp

      # NOERROR 但没有当前查询类型的有效答案
      - matches:
          - "rcode NOERROR"
          - "!has_wanted_ans"
        exec: drop_resp


  # ==========================================
  # 5. 备用线路查询链
  #    保留备用 DNS 的正常否定结果
  # ==========================================

  # 国内备用
  - tag: seq_local_backup
    type: sequence
    args:
      - exec: "$ecs_keep"
      - exec: "$forward_local"

      # 备用线路也出现服务器错误时清除响应
      - matches: "rcode SERVFAIL,REFUSED"
        exec: drop_resp


  # 国外备用
  - tag: seq_remote_backup
    type: sequence
    args:
      - exec: "$ecs_strip"
      - exec: "$forward_remote"

      # 备用线路也出现服务器错误时清除响应
      - matches: "rcode SERVFAIL,REFUSED"
        exec: drop_resp


  # ==========================================
  # 6. 主分流链
  # ==========================================

  - tag: main_sequence
    type: sequence
    args:

      # ----------------------------------------
      # 国内域名：国内主用，国外备用
      # ----------------------------------------

      - matches: "qname $cn_domains"
        exec: "$seq_local"

      # 国内查询成功，直接返回
      - matches: has_resp
        exec: accept

      # 国内没有有效答案，切换国外
      - matches: "qname $cn_domains"
        exec: "$seq_remote_backup"

      - matches: has_resp
        exec: accept


      # ----------------------------------------
      # CDN 域名：国内主用，国外备用
      # ----------------------------------------

      - matches: "qname $cdn_domains"
        exec: "$seq_local"

      - matches: has_resp
        exec: accept

      - matches: "qname $cdn_domains"
        exec: "$seq_remote_backup"

      - matches: has_resp
        exec: accept


      # ----------------------------------------
      # 国外域名：国外主用，国内备用
      # ----------------------------------------

      - matches: "qname $nocn_domains"
        exec: "$seq_remote"

      - matches: has_resp
        exec: accept

      - matches: "qname $nocn_domains"
        exec: "$seq_local_backup"

      - matches: has_resp
        exec: accept


      # ----------------------------------------
      # 未分类域名：国外主用，国内备用
      # ----------------------------------------

      - exec: "$seq_remote"

      - matches: has_resp
        exec: accept

      - exec: "$seq_local_backup"

      - matches: has_resp
        exec: accept


      # ----------------------------------------
      # 所有线路均失败
      # ----------------------------------------

      - exec: reject SERVFAIL


  # ==========================================
  # 7. TCP / UDP 监听
  # ==========================================

  - tag: tcp_in
    type: tcp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"
      idle_timeout: 120

  - tag: udp_in
    type: udp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"


  # ==========================================
  # 8. 订阅规则下载
  # ==========================================

  - tag: subscription_download
    type: download
    args:
      timeout: 60s
      startup_if_missing: true
      downloads:

        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cn_domain.txt"
          dir: "./rules"
          filename: "cn_domain.txt"

        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cdn_domain.txt"
          dir: "./rules"
          filename: "cdn_domain.txt"

        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/nocn_domain.txt"
          dir: "./rules"
          filename: "nocn_domain.txt"


  # ==========================================
  # 9. 规则热更新
  # ==========================================

  - tag: reload_rules
    type: reload_provider
    args:
      - $cn_domains
      - $cdn_domains
      - $nocn_domains


  # ==========================================
  # 10. 定时更新（12 小时）
  # ==========================================

  - tag: subscription_cron
    type: cron
    args:
      jobs:
        - name: refresh_rules
          interval: 12h
          executors:
            - $subscription_download
            - $reload_rules
