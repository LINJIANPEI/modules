log:
  level: info
  file: "../log/oxidns.log"

api:
  http:
    listen: :9199
    webui:
      root: ./webui

plugins:
  - tag: cn_domains
    type: domain_set
    args:
      files:
        - "./custom_cn_domain.txt"
        - "./rules/cn_domain.txt"

  - tag: nocn_domains
    type: domain_set
    args:
      files:
        - "./custom_nocn_domain.txt"
        - "./rules/nocn_domain.txt"

  - tag: cdn_domains
    type: domain_set
    args:
      files:
        - "./rules/cdn_domain.txt"

  # ==========================================
  # 国内、国外 SmartDNS 转发
  # ==========================================

  - tag: forward_local
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "tcp://127.0.0.1:5445"
          bootstrap: "127.0.0.1:5445"
          idle_timeout: 120

  - tag: forward_remote
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "tcp://127.0.0.1:5555"
          bootstrap: "127.0.0.1:5555"
          idle_timeout: 120


  # ==========================================
  # ECS 处理
  # ==========================================

  # ---------- ECS 保留插件（国内用） ----------
  - tag: ecs_keep
    type: ecs_handler
    args:
      forward: true
      send: false

  # ---------- ECS 剥离插件（国外用） ----------
  - tag: ecs_strip
    type: ecs_handler
    args:
      forward: false
      send: false


  # ==========================================
  # 国内、国外专用子链
  # ==========================================

  # ---------- 国内专用子链（保留 ECS） ----------
  - tag: seq_local_keep
    type: sequence
    args:
      - exec: $ecs_keep
      - exec: $forward_local

  # ---------- 国外专用子链（剥离 ECS） ----------
  - tag: seq_remote_strip
    type: sequence
    args:
      - exec: $ecs_strip
      - exec: $forward_remote


  # ==========================================
  # fallback 主备线路
  # ==========================================

  # ---------- 国内优先，国外备用 ----------
  - tag: fallback_local
    type: fallback
    args:
      primary: seq_local_keep
      secondary: seq_remote_strip
      threshold: 500

  # ---------- 国外优先，国内备用 ----------
  - tag: fallback_main
    type: fallback
    args:
      primary: seq_remote_strip
      secondary: seq_local_keep
      threshold: 500


  # ==========================================
  # 中国域名处理链
  # ==========================================

  - tag: seq_cn
    type: sequence
    args:
      - exec: $fallback_local

      - matches: has_resp
        exec: accept

      - exec: reject SERVFAIL


  # ==========================================
  # CDN 域名处理链
  # ==========================================

  - tag: seq_cdn
    type: sequence
    args:
      - exec: $fallback_local

      - matches: has_resp
        exec: accept

      - exec: reject SERVFAIL


  # ==========================================
  # 国外域名处理链
  # ==========================================

  - tag: seq_nocn
    type: sequence
    args:
      - exec: $fallback_main

      - matches: has_resp
        exec: accept

      - exec: reject SERVFAIL


  # ==========================================
  # 未匹配域名处理链
  # ==========================================

  - tag: seq_default
    type: sequence
    args:
      - exec: $fallback_main

      - matches: has_resp
        exec: accept

      - exec: reject SERVFAIL


  # ==========================================
  # 主分流入口
  # ==========================================

  - tag: main_sequence
    type: sequence
    args:

      # ---------- 中国域名 ----------
      - matches: "qname $cn_domains"
        exec: $seq_cn

      # ---------- CDN ----------
      - matches: "qname $cdn_domains"
        exec: $seq_cdn

      # ---------- 国外域名 ----------
      - matches: "qname $nocn_domains"
        exec: $seq_nocn

      # ---------- fallback ----------
      - exec: $seq_default


  # ==========================================
  # TCP / UDP 监听
  # ==========================================

  - tag: tcp_in
    type: tcp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"
      idle_timeout: 120

  - tag: udp_in
    type: udp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"


  # ==========================================
  # 订阅规则下载
  # ==========================================

  - tag: subscription_download
    type: download
    args:
      timeout: 60s
      startup_if_missing: true
      downloads:
        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cn_domain.txt"
          dir: "./rules"
          filename: "cn_domain.txt"

        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cdn_domain.txt"
          dir: "./rules"
          filename: "cdn_domain.txt"

        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/nocn_domain.txt"
          dir: "./rules"
          filename: "nocn_domain.txt"


  # ==========================================
  # 规则热更新
  # ==========================================

  - tag: reload_rules
    type: reload_provider
    args:
      - $cn_domains
      - $cdn_domains
      - $nocn_domains

  # ==========================================
  # 定时更新
  # ==========================================

  - tag: subscription_cron
    type: cron
    args:
      jobs:
        - name: refresh_rules
          interval: 12h
          executors:
            - $subscription_download
            - $reload_rules