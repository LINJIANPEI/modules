
log:
  level: info
  file: "../log/oxidns.log"

api:
  http:
    listen: :9199
    webui:
      root: ./webui

plugins:

  - tag: geosite_cn
    type: geosite
    args:
      file: "./rules/geosite.dat"
      selectors:
        - "cn"

  - tag: geosite_nocn
    type: geosite
    args:
      file: "./rules/geosite.dat"
      selectors:
        - "nocn"

  - tag: geosite_cdn
    type: geosite
    args:
      file: "./rules/geosite.dat"
      selectors:
        - "cdn"


  # ==========================================
  # 2. 域名规则集合
  # ==========================================

  # 国内域名
  - tag: cn_domains
    type: domain_set
    args:
      files:
        - "./custom_cn_domain.txt"
      sets:
        - "geosite_cn"

  # CDN 域名
  - tag: cdn_domains
    type: domain_set
    args:
      sets:
        - "geosite_cdn"

  # 国外域名
  - tag: nocn_domains
    type: domain_set
    args:
      files:
        - "./custom_nocn_domain.txt"
      sets:
        - "geosite_nocn"


  # ==========================================
  # 3. 上游 DNS
  # ==========================================

  # 国内 SmartDNS
  - tag: forward_local
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "tcp://127.0.0.1:5445"
          idle_timeout: 120
          timeout: 3s

  # 国外 SmartDNS
  - tag: forward_remote
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "tcp://127.0.0.1:5555"
          idle_timeout: 120
          timeout: 3s


  # ==========================================
  # 4. ECS 处理
  # ==========================================

  # 国内：保留客户端 ECS，不主动添加
  - tag: ecs_keep
    type: ecs_handler
    args:
      forward: true
      send: false

  # 国外：剥离客户端 ECS
  - tag: ecs_strip
    type: ecs_handler
    args:
      forward: false
      send: false


  # ==========================================
  # 5. 主线路查询链
  #    无有效答案时清除响应，交给备用线路
  # ==========================================

  # 国内主线路
  - tag: seq_local
    type: sequence
    args:
      - exec: "$ecs_keep"
      - exec: "$forward_local"

      # SERVFAIL / REFUSED
      - matches: "rcode SERVFAIL,REFUSED"
        exec: drop_resp

      # NXDOMAIN：交给备用线路
      - matches: "rcode NXDOMAIN"
        exec: drop_resp

      # NOERROR 但没有当前查询类型的有效答案
      - matches:
          - "rcode NOERROR"
          - "!has_wanted_ans"
        exec: drop_resp


  # 国外主线路
  - tag: seq_remote
    type: sequence
    args:
      - exec: "$ecs_strip"
      - exec: "$forward_remote"

      # SERVFAIL / REFUSED
      - matches: "rcode SERVFAIL,REFUSED"
        exec: drop_resp

      # NXDOMAIN：交给备用线路
      - matches: "rcode NXDOMAIN"
        exec: drop_resp

      # NOERROR 但没有当前查询类型的有效答案
      - matches:
          - "rcode NOERROR"
          - "!has_wanted_ans"
        exec: drop_resp


  # ==========================================
  # 6. 备用线路查询链
  #    保留备用 DNS 的正常否定结果
  # ==========================================

  # 国内备用
  - tag: seq_local_backup
    type: sequence
    args:
      - exec: "$ecs_keep"
      - exec: "$forward_local"

      - matches: "rcode SERVFAIL,REFUSED"
        exec: drop_resp


  # 国外备用
  - tag: seq_remote_backup
    type: sequence
    args:
      - exec: "$ecs_strip"
      - exec: "$forward_remote"

      - matches: "rcode SERVFAIL,REFUSED"
        exec: drop_resp


  # ==========================================
  # 7. 主分流链
  # ==========================================

  - tag: main_sequence
    type: sequence
    args:

      # ----------------------------------------
      # 国内域名：国内主用，国外备用
      # ----------------------------------------

      - matches: "qname $cn_domains"
        exec: "$seq_local"

      - matches: has_resp
        exec: accept

      - matches: "qname $cn_domains"
        exec: "$seq_remote_backup"

      - matches: has_resp
        exec: accept


      # ----------------------------------------
      # CDN 域名：国内主用，国外备用
      # ----------------------------------------

      - matches: "qname $cdn_domains"
        exec: "$seq_local"

      - matches: has_resp
        exec: accept

      - matches: "qname $cdn_domains"
        exec: "$seq_remote_backup"

      - matches: has_resp
        exec: accept


      # ----------------------------------------
      # 国外域名：国外主用，国内备用
      # ----------------------------------------

      - matches: "qname $nocn_domains"
        exec: "$seq_remote"

      - matches: has_resp
        exec: accept

      - matches: "qname $nocn_domains"
        exec: "$seq_local_backup"

      - matches: has_resp
        exec: accept


      # ----------------------------------------
      # 未分类域名：国外主用，国内备用
      # ----------------------------------------

      - exec: "$seq_remote"

      - matches: has_resp
        exec: accept

      - exec: "$seq_local_backup"

      - matches: has_resp
        exec: accept


      # ----------------------------------------
      # 所有线路均失败
      # ----------------------------------------

      - exec: reject SERVFAIL


  # ==========================================
  # 8. TCP / UDP 监听
  # ==========================================

  - tag: tcp_in
    type: tcp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"
      idle_timeout: 120

  - tag: udp_in
    type: udp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"


  # ==========================================
  # 9. 订阅规则下载
  #    TXT + GitHub 最新 Release DAT
  # ==========================================

  - tag: subscription_download
    type: download
    args:
      timeout: 120s
      startup_if_missing: true

      downloads:

        # geosite.dat
        - url: "https://github.com/LINJIANPEI/mosdnsRules/releases/latest/download/geosite.dat"
          dir: "./rules"
          filename: "geosite.dat"

        # geoip.dat
        - url: "https://github.com/LINJIANPEI/mosdnsRules/releases/latest/download/geoip.dat"
          dir: "./rules"
          filename: "geoip.dat"


  # ==========================================
  # 10. 规则热更新
  # ==========================================

  - tag: reload_rules
    type: reload_provider
    args:
      - "$geosite_cn"
      - "$geosite_nocn"
      - "$geosite_cdn"
      - "$cn_domains"
      - "$cdn_domains"
      - "$nocn_domains"


  # ==========================================
  # 11. 定时更新（12 小时）
  # ==========================================

  - tag: subscription_cron
    type: cron
    args:
      jobs:
        - name: refresh_rules
          interval: 12h
          executors:
            - "$subscription_download"
            - "$reload_rules"
