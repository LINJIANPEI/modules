
log:
  level: info
  file: "../log/oxidns.log"

api:
  http:
    listen: :9199
    webui:
      root: ./webui

plugins:

  - tag: geosite_cn
    type: geosite
    args:
      file: "./rules/geosite.dat"
      selectors:
        - "cn"

  - tag: geoip_cn
    type: geoip
    args:
      file: "./rules/geoip.dat"
      selectors:
        - "cn"

  - tag: geosite_nocn
    type: geosite
    args:
      file: "./rules/geosite.dat"
      selectors:
        - "nocn"
 
  - tag: geoip_nocn
    type: geoip
    args:
      file: "./rules/geoip.dat"
      selectors:
        - "nocn"

  - tag: geosite_cdn
    type: geosite
    args:
      file: "./rules/geosite.dat"
      selectors:
        - "cdn"

  - tag: geoip_private
    type: geoip
    args:
      file: "./rules/geoip.dat"
      selectors:
        - "private"

  # 国内域名
  - tag: cn_domains
    type: domain_set
    args:
      files:
        - "./custom_cn_domain.txt"
      sets:
        - "geosite_cn"
        
  # 国内IP
  - tag: cn_ip
    type: ip_set
    args:
      sets:
        - "geoip_cn"

  # CDN 域名
  - tag: cdn_domains
    type: domain_set
    args:
      sets:
        - "geosite_cdn"
        
  # 私有IP
  - tag: private_ip
    type: ip_set
    args:
      sets:
        - "geoip_private"

  # 国外域名
  - tag: nocn_domains
    type: domain_set
    args:
      files:
        - "./custom_nocn_domain.txt"
      sets:
        - "geosite_nocn"
        
  # 国外IP
  - tag: nocn_ip
    type: ip_set
    args:
      sets:
        - "geoip_nocn"


  # 国内 DNS
  - tag: forward_local
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "tcp://127.0.0.1:5445"
          idle_timeout: 120
          timeout: 3s

  # 国外 DNS
  - tag: forward_remote
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: "tcp://127.0.0.1:5555"
          idle_timeout: 120
          timeout: 3s


  # 国内：保留客户端 ECS，不主动添加
  - tag: ecs_keep
    type: ecs_handler
    args:
      forward: true
      send: false

  # 国外：剥离客户端 ECS
  - tag: ecs_strip
    type: ecs_handler
    args:
      forward: false
      send: false

  # 国内主线路
  - tag: seq_local
    type: sequence
    args:
      - exec: "$ecs_keep"
      - exec: "$forward_local"


  # 国外主线路
  - tag: seq_remote
    type: sequence
    args:
      - exec: "$ecs_strip"
      - exec: "$forward_remote"

  # 国内 SmartDNS
  - tag: forward_fallback
    type: fallback
    args:
      # 首选路径
      primary: "seq_remote"
      # 兜底路径
      secondary: "seq_local"
      # 主路径超过 600ms 后允许备用路径接管
      threshold: 600
      # 让备用路径始终并行待命，换取更低尾延迟
      always_standby: false


  - tag: main_sequence
    type: sequence
    args:

      - matches: "qname $cn_domains"
        exec: "$seq_local"
        
      - matches: "!resp_ip $cn_ip"
        exec: drop_resp

      - matches: has_resp
        exec: accept

      - matches: "qname $cdn_domains"
        exec: "$seq_remote"

      - matches: has_resp
        exec: accept

      - matches: "qname $nocn_domains"
        exec: "$seq_remote"
        
      - matches: "resp_ip $cn_ip"
        exec: drop_resp

      - matches: has_resp
        exec: accept

      - exec: "$forward_fallback"

      - matches: has_resp
        exec: accept


  - tag: tcp_in
    type: tcp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"
      idle_timeout: 120

  - tag: udp_in
    type: udp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"

  - tag: subscription_download
    type: download
    args:
      timeout: 120s
      startup_if_missing: true

      downloads:

        # geosite.dat
        - url: "https://github.com/LINJIANPEI/mosdnsRules/releases/latest/download/geosite.dat"
          dir: "./rules"
          filename: "geosite.dat"

        # geoip.dat
        - url: "https://github.com/LINJIANPEI/mosdnsRules/releases/latest/download/geoip.dat"
          dir: "./rules"
          filename: "geoip.dat"

  - tag: reload_rules
    type: reload_provider
    args:
      - "$geosite_cn"
      - "$geosite_nocn"
      - "$geosite_cdn"
      - "$geoip_cn"
      - "$geoip_nocn"
      - "$geoip_private"
      - "$cn_domains"
      - "$cdn_domains"
      - "$nocn_domains"
      - "$cn_ip"
      - "$private_ip"
      - "$nocn_ip"


  - tag: subscription_cron
    type: cron
    args:
      jobs:
        - name: refresh_rules
          interval: 12h
          executors:
            - "$subscription_download"
            - "$reload_rules"