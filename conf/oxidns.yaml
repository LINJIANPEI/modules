log:
  level: info
  file: "../log/oxidns.log"

api:
  http:
    listen: :9199
    webui:
      root: ./webui

plugins:
  - tag: cn_domains
    type: domain_set
    args:
      files:
        - "./custom_cn_domain.txt"
        - "./rules/cn_domain.txt"

  - tag: nocn_domains
    type: domain_set
    args:
      files:
        - "./custom_nocn_domain.txt"
        - "./rules/nocn_domain.txt"

  - tag: cdn_domains
    type: domain_set
    args:
      files:
        - "./rules/cdn_domain.txt"

#  - tag: cn_ips
#    type: ip_set
#    args:
#      files:
#        - "./rules/cn_ip.txt"

#  - tag: nocn_ips
#    type: ip_set
#    args:
#      files:
#        - "./rules/nocn_ip.txt"


  - tag: forward_local
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "tcp://127.0.0.1:5445"
          bootstrap: "127.0.0.1:5445"
          idle_timeout: 120

  - tag: forward_remote
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "tcp://127.0.0.1:5555"
          bootstrap: "127.0.0.1:5555"
          idle_timeout: 120

  # ---------- ECS 保留插件（国内用） ----------
  - tag: ecs_keep
    type: ecs_handler
    args:
      forward: true    # 转发客户端传来的 ECS
      send: false      # 不主动生成 ECS

  # ---------- ECS 剥离插件（国外用） ----------
  - tag: ecs_strip
    type: ecs_handler
    args:
      forward: false   # 不转发客户端传来的 ECS
      send: false      # 也不主动生成 ECS

  # ---------- 国内专用子链（保留 ECS） ----------
  - tag: seq_local_keep
    type: sequence
    args:
      - exec: $ecs_keep           # 保留 ECS
      - exec: $forward_local      # 转发到 home 组
      - matches: has_resp
        exec: accept

  # ---------- 国外专用子链（剥离 ECS） ----------
  - tag: seq_remote_strip
    type: sequence
    args:
      - exec: $ecs_strip          # 剥离 ECS
      - exec: $forward_remote     # 转发到 office 组
      - matches: has_resp
        exec: accept

  - tag: fallback_main
    type: fallback
    args:
      primary: seq_remote_strip   # 主路径：剥离 ECS 后走国外
      secondary: seq_local_keep   # 备路径：保留 ECS 走国内
      threshold: 50
      always_standby: true
   
  - tag: cache_main
    type: cache
    args:
      size: 512
      lazy_cache_ttl: 30
      dump_file: "/data/adb/modules/Linlin/cache/oxidns.cache"
      dump_interval: 3600


  - tag: main_sequence
    type: sequence
    args:
    
      #- exec: $cache_main
      
      #- matches: has_resp
      #  exec: accept
      
      # ---------- ipv6处理 ----------
      #- matches: "qtype 28"
      #  exec: $forward_local
        
      #- matches: has_resp
      #  exec: accept

      # ---------- 中国域名 ----------
      - matches: "qname $cn_domains"
        exec: $seq_local_keep
        
#      - matches: "resp_ip $cn_ips"
#        exec: drop_resp

      - exec: prefer_ipv4
      - matches: has_resp
        exec: accept

      # ---------- CDN ----------
      - matches: "qname $cdn_domains"
        exec: $seq_local_keep
        
#      - matches: "resp_ip $cn_ips"
#        exec: drop_resp

      - exec: prefer_ipv4
      - matches: has_resp
        exec: accept

      # ---------- 国外域名 ----------
      - matches: "qname $nocn_domains"
        exec: $seq_remote_strip
        
#      - matches: "resp_ip $nocn_ips"
#        exec: drop_resp

      - exec: prefer_ipv4
      - matches: has_resp
        exec: accept

      # ---------- fallback ----------
      - exec: $fallback_main

      - exec: prefer_ipv4
      - matches: has_resp
        exec: accept

      # 兜底：fallback 也失败时返回 SERVFAIL 并终止
      - exec: reject SERVFAIL

  - tag: tcp_in
    type: tcp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"
      idle_timeout: 120
  
  - tag: udp_in
    type: udp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"



  - tag: subscription_download
    type: download
    args:
      timeout: 60s
      startup_if_missing: true
      downloads:
        - url: "https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cn_domain.txt"
          dir: "./rules"
          filename: "cn_domain.txt"
        - url: "https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cdn_domain.txt"
          dir: "./rules"
          filename: "cdn_domain.txt"
        - url: "https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/nocn_domain.txt"
          dir: "./rules"
          filename: "nocn_domain.txt"
#        - url: "https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cn_ip.txt"
#          dir: "./rules"
#          filename: "cn_ip.txt"
#        - url: "https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/nocn_ip.txt"
#          dir: "./rules"
#          filename: "nocn_ip.txt"


  - tag: reload_rules
    type: reload_provider
    args:
      - $cn_domains
      - $cdn_domains
      - $nocn_domains
#      - $cn_ips
#      - $nocn_ips
  - tag: subscription_cron
    type: cron
    args:
      jobs:
        - name: refresh_rules
          interval: 12h
          executors:
            - $subscription_download
            - $reload_rules