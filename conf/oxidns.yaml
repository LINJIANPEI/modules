log:
  level: info
  file: "../log/oxidns.log"

api:
  http:
    listen: :9199
    webui:
      root: ./webui

plugins:
  # ==========================================
  # 规则集（国内 / CDN / 国外 分开）
  # ==========================================
  - tag: cn_domains
    type: domain_set
    args:
      files:
        - "./custom_cn_domain.txt"
        - "./rules/cn_domain.txt"

  - tag: cdn_domains
    type: domain_set
    args:
      files:
        - "./rules/cdn_domain.txt"

  - tag: nocn_domains
    type: domain_set
    args:
      files:
        - "./custom_nocn_domain.txt"
        - "./rules/nocn_domain.txt"

  # ==========================================
  # 上游转发（国内 / 国外 SmartDNS）
  # ==========================================
  - tag: forward_local
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "tcp://127.0.0.1:5445"
          bootstrap: "127.0.0.1:5445"
          idle_timeout: 120

  - tag: forward_remote
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "tcp://127.0.0.1:5555"
          bootstrap: "127.0.0.1:5555"
          idle_timeout: 120

  # ==========================================
  # ECS 处理
  # ==========================================
  # 国内：保留客户端 ECS 并转发，不主动添加
  - tag: ecs_keep
    type: ecs_handler
    args:
      forward: true
      send: false

  # 国外：剥离 ECS
  - tag: ecs_strip
    type: ecs_handler
    args:
      forward: false
      send: false

  # ==========================================
  # 两条原子链（ECS + 转发绑定）
  # ==========================================
  - tag: seq_local
    type: sequence
    args:
      - exec: $ecs_keep
      - exec: $forward_local

  - tag: seq_remote
    type: sequence
    args:
      - exec: $ecs_strip
      - exec: $forward_remote

  # ==========================================
  # 两个 fallback（主备顺序不同，启用 short_circuit）
  # ==========================================
  - tag: fallback_local_first
    type: fallback
    args:
      primary: seq_local
      secondary: seq_remote
      threshold: 500
      short_circuit: true

  - tag: fallback_remote_first
    type: fallback
    args:
      primary: seq_remote
      secondary: seq_local
      threshold: 500
      short_circuit: true

  # ==========================================
  # 主分流链（exec + has_resp 收口）
  # ==========================================
  - tag: main_sequence
    type: sequence
    args:
      # 1. 国内域名 → 国内优先
      - matches: "qname $cn_domains"
        exec: $fallback_local_first
      - matches: has_resp
        exec: accept

      # 2. CDN 域名 → 国内优先（独立匹配，策略同国内）
      - matches: "qname $cdn_domains"
        exec: $fallback_local_first
      - matches: has_resp
        exec: accept

      # 3. 国外域名 → 国外优先
      - matches: "qname $nocn_domains"
        exec: $fallback_remote_first
      - matches: has_resp
        exec: accept

      # 4. 未匹配 → 国外优先
      - exec: $fallback_remote_first
      - matches: has_resp
        exec: accept

      # 5. 兜底：所有尝试均失败
      - exec: reject SERVFAIL

  # ==========================================
  # TCP / UDP 监听
  # ==========================================
  - tag: tcp_in
    type: tcp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"
      idle_timeout: 120

  - tag: udp_in
    type: udp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5335"

  # ==========================================
  # 订阅规则下载
  # ==========================================
  - tag: subscription_download
    type: download
    args:
      timeout: 60s
      startup_if_missing: true
      downloads:
        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cn_domain.txt"
          dir: "./rules"
          filename: "cn_domain.txt"

        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/cdn_domain.txt"
          dir: "./rules"
          filename: "cdn_domain.txt"

        - url: "https://gh-proxy.com/https://raw.githubusercontent.com/LINJIANPEI/mosdnsRules/main/rule/nocn_domain.txt"
          dir: "./rules"
          filename: "nocn_domain.txt"

  # ==========================================
  # 规则热更新
  # ==========================================
  - tag: reload_rules
    type: reload_provider
    args:
      - $cn_domains
      - $cdn_domains
      - $nocn_domains

  # ==========================================
  # 定时更新（12 小时）
  # ==========================================
  - tag: subscription_cron
    type: cron
    args:
      jobs:
        - name: refresh_rules
          interval: 12h
          executors:
            - $subscription_download
            - $reload_rules