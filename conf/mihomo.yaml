# mihomo文档 h(tps://wiki.metacubex.one/config/dns/hosts/#hosts

mode: rule # 规则模式
mixed-port: 7890 # socks/http代理端口
authentication:
    - Linlin:201314
redir-port: 7892 # redirect透明代理端口
tproxy-port: 7893 # tproxy透明代理端口
allow-lan: true # 允许局域网访问
ipv6: true # 开启ipv6
unified-delay: true #统一延迟
log-level: info # 日志等级
tcp-concurrent: true # 启用 TCP 并发连接
# TCP Keep Alive 设置，减少设备耗电问题
keep-alive-interval: 30
keep-alive-idle: 15
find-process-mode: strict # 进程查找模式
global-client-fingerprint: chrome # 全局客户端指纹模拟为 Chrome 浏览器
# 域名嗅探 https://wiki.metacubex.one/config/sniff/#_1
sniffer:
    enable: true
    force-dns-mapping: true
    parse-pure-ip: true
    override-destination: false
    sniff:
        HTTP:
            ports: [80, 8080-8880]
            override-destination: false
        TLS:
            ports: [443, 8443]
        QUIC:
            ports: [443, 8443]
    force-domain:
        - "+.netflix.com"
        - "+.nflxvideo.net"
        - "+.amazonaws.com"
        - "+.media.dssott.com"
    skip-domain:
        - Mijia Cloud
        - dlg.io.mi.com
        - "+.oray.com"
        - "+.sunlogin.net"
        - "+.push.apple.com"
# 缓存
profile:
    store-selected: true
    # 储存 API 对策略组的选择，以供下次启动时使用
    store-fake-ip: false
    # 储存 fakeip 映射表，域名再次发生连接时，使用原有映射地址
# 自动同步时间以防止时间不准导致无法正常联网
ntp:
    enable: true
    # 是否同步至系统时间，需要 root/管理员权限
    write-to-system: false
    server: time.apple.com
    port: 123
    interval: 30
# 管理页面 https://wiki.metacubex.one/config/general/#_7
external-controller: 127.0.0.1:9090
secret: "201314"
# external-ui: yacd
external-ui: zashboard #使用zashboard为本地管理ui
external-ui-url: "https://ghfast.top/https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip"
bind-address: "*"
# tun虚拟网卡设置 不懂默认就好 默认开启tun
tun:
    enable: true
    device: mihomo
    stack: mixed
    auto-route: true # 自动添加路由
    strict-route: true # 严格路由模式
    endpoint-independent-nat: true # 启用端点独立 NAT
    auto-redirect: true # 自动重定向流量到 TUN 设备
    auto-detect-interface: true # 自动检测网络接口
    disable-icmp-forwarding: false # 禁用 ICMP 转发
    # iproute2-table-index: 2025
    # iproute2-rule-index: 5000
    dns-hijack: []
    exclude-package:
        - com.eg.android.AlipayGphone
        - com.taobao.taobao
        - com.xunmeng.pinduoduo
        - tv.danmaku.bili
        - com.ss.android.ugc.aweme
        - com.larus.nova
        - com.miHoYo.hkrpg
        - com.miHoYo.Yuanshen
        - com.tencent.tmgp.sgame
        - com.tencent.mm
        - com.tencent.mobileqq
        - com.autonavi.minimap
        - com.netease.cloudmusic
        - com.sankuai.meituan
        - com.phoenix.read
        - com.alicloud.databox
        - bf.sgs.hdexp
dns:
    enable: false
    listen: 0.0.0.0:1053
    cache-algorithm: none
    ipv6: true
    respect-rules: false
    enhanced-mode: redir-host
    nameserver:
        - "tcp://127.0.0.1:5591"
        - "udp://127.0.0.1:5591"
    default_nameserver:
        - "tcp://127.0.0.1:5591"
        - "udp://127.0.0.1:5591"
    fallback:
        - "tcp://127.0.0.1:5591"
        - "udp://127.0.0.1:5591"
proxies:
    - name: "➡️ 直连"
      type: "direct"
      udp: true
      ip-version: "ipv4-prefer"
      client-fingerprint: "chrome"
# mihomo配置参考可以看看这个wiki
# https://wiki.metacubex.one
#预设
pr: &pr
    type: select
    interval: 3600
    health-check:
        enable: true
        url: https://www.gstatic.com/generate_204
        interval: 300
        timeout: 3000
    include-all: true
autotest: &autotest
    type: url-test
    interval: 300
    tolerance: 100
    health-check:
        enable: true
        url: https://www.gstatic.com/generate_204
        interval: 120
        timeout: 3000
    include-all: true
p: &p
    type: http
    interval: 3600
    health-check:
        enable: true
        url: https://www.gstatic.com/generate_204
        timeout: 1500
        interval: 300
        lazy: true
# 代理提供(订阅)组
# url 里填写自己的订阅,名称不能重复
proxy-providers:
    机场1: #机场名
        type: http
        interval: 3600
        health-check:
            enable: true
            url: https://www.gstatic.com/generate_204
            timeout: 1500
            interval: 300
            lazy: true
        url: ""
        # path: ./proxy_providers/jichang1.yaml #指定保存路径 非必填
    机场2: #机场名
        type: http
        interval: 3600
        health-check:
            enable: true
            url: https://www.gstatic.com/generate_204
            timeout: 1500
            interval: 300
            lazy: true
        url: ""
        # path: ./proxy_providers/jichang2.yaml #保存路径
proxy-groups:
    - name: "\U0001F680 国外代理"
      type: "select"
      proxies:
        - "♻️ 自动选择"
        - "➡️ 直连"
        - "\U0001F1ED\U0001F1F0 香港"
        - "\U0001F1F9\U0001F1FC 台湾"
        - "\U0001F1EF\U0001F1F5 日本"
        - "\U0001F1F8\U0001F1EC 新加坡"
        - "\U0001F1EC\U0001F1E7 英国"
        - "\U0001F1FA\U0001F1F8 美国"
        - "\U0001F310 全部节点"
      disable-udp: false
    - name: "\U0001F3AF 国内代理"
      type: "select"
      proxies:
        - "➡️ 直连"
        - "\U0001F1E8\U0001F1F3 中国"
        - "♻️ 自动选择"
      disable-udp: false
    - name: "\U0001F41F 漏网之鱼"
      type: "select"
      proxies:
        - "♻️ 自动选择"
        - "➡️ 直连"
        - "\U0001F1ED\U0001F1F0 香港"
        - "\U0001F1F9\U0001F1FC 台湾"
        - "\U0001F1EF\U0001F1F5 日本"
        - "\U0001F1F8\U0001F1EC 新加坡"
        - "\U0001F1EC\U0001F1E7 英国"
        - "\U0001F1FA\U0001F1F8 美国"
        - "\U0001F310 全部节点"
      disable-udp: false
    - {name: "\U0001F1E8\U0001F1F3 中国", !!merge <<: *pr, proxies: [中国自动选择], filter: "(?i)(\U0001F1E8\U0001F1F3|中国|cn|china|CN)", exclude-filter: "(?i)(台湾|tw|taiwan|TW)"}
    - {name: "\U0001F1ED\U0001F1F0 香港", !!merge <<: *pr, proxies: [香港自动选择], filter: "(?i)(\U0001F1ED\U0001F1F0|香港|hk|hongkong|hong kong|HK)"}
    - {name: "\U0001F1F9\U0001F1FC 台湾", !!merge <<: *pr, proxies: [台湾自动选择], filter: "(?i)(\U0001F1F9\U0001F1FC|台湾|tw|taiwan|TW)"}
    - {name: "\U0001F1EF\U0001F1F5 日本", !!merge <<: *pr, proxies: [日本自动选择], filter: "(?i)(\U0001F1EF\U0001F1F5|日|jp|japan|JP)"}
    - {name: "\U0001F1FA\U0001F1F8 美国", !!merge <<: *pr, proxies: [美国自动选择], filter: "(?i)(\U0001F1FA\U0001F1F8|美|us|unitedstates|united states|US)"}
    - {name: "\U0001F1EC\U0001F1E7 英国", !!merge <<: *pr, proxies: [英国自动选择], filter: "(?i)(\U0001F1EC\U0001F1E7|英国|uk|英国|England|UK)"}
    - {name: "\U0001F1F8\U0001F1EC 新加坡", !!merge <<: *pr, proxies: [新加坡自动选择], filter: "(?i)(\U0001F1F8\U0001F1EC|新加坡|sg|singapore|SG)"}
    - {name: "\U0001F310 全部节点", proxies: [♻️ 自动选择], !!merge <<: *pr}
    # 下面这段为自动选择不会在面板显示 如果显示了说明你的面板不支持hidden字段
    - {name: 中国自动选择, !!merge <<: *autotest, hidden: false, filter: "(?i)(\U0001F1E8\U0001F1F3|中国|cn|china|CN)", exclude-filter: "(?i)(台湾|tw|taiwan|TW)"}
    - {name: 香港自动选择, !!merge <<: *autotest, hidden: false, filter: "(?i)(\U0001F1ED\U0001F1F0|香港|hk|hongkong|hong kong|HK)"}
    - {name: 台湾自动选择, !!merge <<: *autotest, hidden: false, filter: "(?i)(\U0001F1F9\U0001F1FC|台湾|tw|taiwan|TW)"}
    - {name: 日本自动选择, !!merge <<: *autotest, hidden: false, filter: "(?i)(\U0001F1EF\U0001F1F5|日|jp|japan|JP)"}
    - {name: 美国自动选择, !!merge <<: *autotest, hidden: false, filter: "(?i)(\U0001F1FA\U0001F1F8|美|us|unitedstates|united states|US)"}
    - {name: 英国自动选择, !!merge <<: *autotest, hidden: false, filter: "(?i)(\U0001F1EC\U0001F1E7|英国|uk|英国|England|UK)"}
    - {name: 新加坡自动选择, !!merge <<: *autotest, hidden: false, filter: "(?i)(\U0001F1F8\U0001F1EC|新加坡|sg|singapore|SG)"}
    - {name: ♻️ 自动选择, !!merge <<: *autotest, hidden: false, filter: "^((?!(直连)).)*$"}
# ==========================================
# GEO 数据库
# ==========================================
# 使用 DAT 格式
geodata-mode: true
# GeoSite 匹配器
geosite-matcher: succinct
# 内存优化加载
geodata-loader: memconservative
# 自动更新
geo-auto-update: true
# 每 24 小时更新一次
geo-update-interval: 24
# 自定义 GEO 数据库下载地址
geox-url:
    geosite: "https://github.com/LINJIANPEI/mosdnsRules/releases/latest/download/geosite.dat"
    geoip: "https://github.com/LINJIANPEI/mosdnsRules/releases/latest/download/geoip.dat"
rules:
    - "GEOSITE,private,\U0001F3AF 国内代理"
    - "GEOIP,private,\U0001F3AF 国内代理"
    - "GEOSITE,cn,\U0001F3AF 国内代理"
    - "GEOIP,cn,\U0001F3AF 国内代理"
    - "GEOSITE,cdn,\U0001F680 国外代理"
    - "GEOSITE,nocn,\U0001F680 国外代理"
    - "GEOIP,nocn,\U0001F680 国外代理"
    - "MATCH,\U0001F41F 漏网之鱼"